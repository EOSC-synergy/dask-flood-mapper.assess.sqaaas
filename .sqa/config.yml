config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/interTwin-eu/dask-flood-mapper:
      branch: workshop-modified
      repo: https://github.com/interTwin-eu/dask-flood-mapper
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/interTwin-eu/dask-flood-mapper git:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-cobalt-havanese.sh
        container: qc.acc_scaly-black-cuscus
  QC.Doc:
    repos:
      github.com/interTwin-eu/dask-flood-mapper find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-denim-vulture.sh
        container: qc.doc_lovely-lilac-tuatara
      github.com/interTwin-eu/dask-flood-mapper git:
        commands:
        - /usr/bin/env sh .sqa/script.homey-cerulean-ocelot.sh
        container: qc.doc_fuzzy-chestnut-tang
      github.com/interTwin-eu/dask-flood-mapper markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-gold-devil.sh
        container: qc.doc_beady-razzmatazz-catfish
  QC.Lic:
    repos:
      github.com/interTwin-eu/dask-flood-mapper licensee:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-sepia-quetzal.sh
        container: qc.lic_silly-razzmatazz-moth
  QC.Met:
    repos:
      github.com/interTwin-eu/dask-flood-mapper cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-sapphire-owl.sh
        container: qc.met_fuzzy-saffron-ibis
  QC.Sec:
    repos:
      github.com/interTwin-eu/dask-flood-mapper bandit:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-gamboge-gar.sh
        container: qc.sec_jumpy-scarlet-chihuahua
  QC.Sty:
    repos:
      github.com/interTwin-eu/dask-flood-mapper flake8:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-carmine-zonkey.sh
        container: qc.sty_zippy-grey-dragonfly
      github.com/interTwin-eu/dask-flood-mapper hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-zucchini-kingfisher.sh
        container: qc.sty_breezy-tomato-bloodhound
      github.com/interTwin-eu/dask-flood-mapper jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-lilac-walrus.sh
        container: qc.sty_woolly-platinum-yak
  QC.Uni:
    repos:
      github.com/interTwin-eu/dask-flood-mapper pytest:
        commands:
        - /usr/bin/env sh .sqa/script.messy-pear-giraffe.sh
        container: qc.uni_sunny-firebrick-mole
  QC.Ver:
    repos:
      github.com/interTwin-eu/dask-flood-mapper get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-rose-penguin.sh
        container: qc.ver_zippy-burgundy-vole
timeout: 5400
